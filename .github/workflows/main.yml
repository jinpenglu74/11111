name: Build ROI Calculator EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name ROI_Calculator roi_calculator.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ROI_Calculator_Windows
          path: dist/ROI_Calculator.exe
