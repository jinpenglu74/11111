name: RewriteDubbing V2 Windows Build

on:
  push:
    branches:
      - rewrite-dubbing-v2-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          ref: rewrite-dubbing-v2-build

      - name: Verify and unpack V2 patch bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$pwd\rewrite-v2\ci-bundle-current.zip"
          if (-not (Test-Path $zip)) { throw "V2 patch bundle is missing" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "34660344208df22dc6d921c4502ec22c5aab740380c9716bb1a22dc0f296074b") { throw "V2 patch bundle SHA256 mismatch: $hash" }
          Write-Host "bundle sha256=$hash"
          Expand-Archive $zip "$pwd\rewrite-v2\bundle" -Force
          if (-not (Test-Path "$pwd\rewrite-v2\bundle\ai-core-patch\apply_v2_core_patch.py")) {
            throw "V2 patch bundle is incomplete"
          }
          python rewrite-v2/bundle/ai-core-patch/tests/run_v2_contract_tests.py rewrite-v2/bundle/ai-core-patch

      - name: Clone frozen Multi-AI Chat v1.9.6
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.9.6 https://github.com/TED-H-com/multi-ai-chat-desktop.git upstream

      - name: Apply RewriteDubbing V2 core and regression patches
        shell: pwsh
        run: |
          python rewrite-v2/bundle/ai-core-patch/apply_v2_core_patch.py upstream
          python rewrite-v2/bundle/ai-core-patch/apply_v2_regression_patch.py upstream

      - name: Clone and patch VeloVoice
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/jinpenglu74/VeloVoice.git velovoice
          python rewrite-v2/bundle/patch_velovoice.py velovoice rewrite-v2/bundle
          $sidecarApp = "velovoice/src/main/java/mai_onsyn/RewriteDubbingV2/velo/VeloVoiceSidecarApp.java"
          $source = Get-Content $sidecarApp -Raw
          $source = $source -replace '(?m)^\s*WindowManager\.initializeAutoPaneBackground\(root\);\r?\n?', ''
          Set-Content $sidecarApp $source -Encoding UTF8
      - name: Restore VeloVoice JACOB 1.21 dependency
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/freemansoft/jacob-project/releases/download/Root_B-1_21/jacob-1.21.zip" -OutFile "$env:RUNNER_TEMP\jacob.zip"
          Expand-Archive "$env:RUNNER_TEMP\jacob.zip" "$env:RUNNER_TEMP\jacob" -Force
          New-Item -ItemType Directory -Force velovoice/lib/jacob-1.21 | Out-Null
          $jar = Get-ChildItem "$env:RUNNER_TEMP\jacob" -Recurse -Filter jacob.jar | Select-Object -First 1
          $dll64 = Get-ChildItem "$env:RUNNER_TEMP\jacob" -Recurse -Filter "*x64*.dll" | Select-Object -First 1
          $dll86 = Get-ChildItem "$env:RUNNER_TEMP\jacob" -Recurse -Filter "*x86*.dll" | Select-Object -First 1
          if (-not $jar -or -not $dll64) { throw "Official JACOB 1.21 archive did not contain jacob.jar/x64 DLL" }
          Copy-Item $jar.FullName velovoice/lib/jacob-1.21/jacob.jar
          Copy-Item $dll64.FullName velovoice/lib/jacob-1.21/jacob-1.21-x64.dll
          if ($dll86) { Copy-Item $dll86.FullName velovoice/lib/jacob-1.21/jacob-1.21-x86.dll }

      - name: Build SRT library dependency
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/jonathanedgecombe/srt-library.git "$env:RUNNER_TEMP\srt-library"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\srt-classes" | Out-Null
          $sources = Get-ChildItem "$env:RUNNER_TEMP\srt-library\src" -Recurse -Filter *.java | ForEach-Object FullName
          if (-not $sources) { throw "SRT library Java sources missing" }
          javac -encoding UTF-8 -d "$env:RUNNER_TEMP\srt-classes" $sources
          jar --create --file velovoice/lib/srt-library.jar -C "$env:RUNNER_TEMP\srt-classes" .

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Build VeloVoice V2 sidecar
        shell: pwsh
        working-directory: velovoice
        run: |
          mvn -B -DskipTests clean package assembly:single
          $jar = Get-ChildItem target -Filter "*-release.jar" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $jar) { throw "VeloVoice release JAR was not produced" }
          Copy-Item $jar.FullName "$env:RUNNER_TEMP\RewriteDubbing-V2-VeloVoice-Sidecar.jar"
          java -cp $jar.FullName mai_onsyn.RewriteDubbingV2.velo.VeloVoiceProtocolSelfTest

      - name: Build bundled Java runtime
        shell: pwsh
        run: |
          $modules = (java --list-modules | ForEach-Object { ($_ -split "@")[0] }) -join ","
          jlink --add-modules $modules --strip-debug --no-header-files --no-man-pages --compress=zip-6 --output upstream/v2-resources/Runtime
          New-Item -ItemType Directory -Force upstream/v2-resources/Dependencies | Out-Null
          Copy-Item velovoice/lib/jacob-1.21/jacob-1.21-x64.dll upstream/v2-resources/Dependencies/
          Copy-Item "$env:RUNNER_TEMP\RewriteDubbing-V2-VeloVoice-Sidecar.jar" upstream/v2-resources/

      - name: Setup Node 24 and pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.0.0'
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Official frontend verify plus V2 tests
        working-directory: upstream
        run: pnpm verify

      - name: Rust unit tests
        working-directory: upstream
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Create clean patched source archive
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('upstream'); out=pathlib.Path('RewriteDubbing_V2.0.0_Source.zip'); skip={'.git','node_modules','target','dist','Runtime'}; z=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED); [(z.write(p,p.relative_to(root)) if not any(part in skip for part in p.relative_to(root).parts) else None) for p in root.rglob('*') if p.is_file()]; z.close()"

      - name: Build Windows installer
        working-directory: upstream
        run: pnpm tauri build --bundles nsis

      - name: Collect deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deliverables | Out-Null
          $installer = Get-ChildItem upstream/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing" }
          Copy-Item $installer.FullName deliverables/RewriteDubbing_V2.0.0_Setup.exe
          Copy-Item RewriteDubbing_V2.0.0_Source.zip deliverables/
          Get-FileHash deliverables/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content deliverables/SHA256.txt -Encoding ascii

      - name: Upload tested Windows V2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RewriteDubbing-V2-Windows
          path: deliverables/*
          if-no-files-found: error
          retention-days: 7
