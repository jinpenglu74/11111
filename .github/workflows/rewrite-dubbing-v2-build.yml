name: RewriteDubbing V2 Windows Acceptance

on:
  push:
    branches:
      - rewrite-dubbing-v2-acceptance
    paths:
      - 'rewrite-v2/**'
      - '.github/workflows/rewrite-dubbing-v2-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-accept:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      V2_VERSION: 2.0.0
      UPSTREAM_TAG: v1.9.6
      CI_BUNDLE_SHA256: 5fb1912d0ba4c2109d00ef4f2c2a24da0a7100531abdb1ec88bcc46fbe61200c

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify and expand V2 patch bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = (Get-Content -Raw 'rewrite-v2/ci-bundle.b64') -replace '\\s',''
          $bundle = 'ci-bundle.zip'
          [IO.File]::WriteAllBytes($bundle, [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CI_BUNDLE_SHA256) { throw "CI bundle SHA256 mismatch: $actual" }
          Expand-Archive -LiteralPath $bundle -DestinationPath ci-bundle -Force
          if (-not (Test-Path ci-bundle/ai-core-patch/apply_v2_core_patch.py)) { throw 'V2 core patch missing' }
          if (-not (Test-Path ci-bundle/patch_velovoice.py)) { throw 'VeloVoice patch missing' }
          Write-Host "CI_BUNDLE_OK $actual"

      - name: Run pre-build V2 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python ci-bundle/ai-core-patch/tests/run_v2_contract_tests.py
          node ci-bundle/ai-core-patch/tests/pipeline-behavior.test.mjs
          python -m py_compile ci-bundle/patch_velovoice.py ci-bundle/ai-core-patch/apply_v2_core_patch.py ci-bundle/ai-core-patch/apply_v2_regression_patch.py

      - name: Clone frozen upstream sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force work | Out-Null
          git clone --depth 1 --branch $env:UPSTREAM_TAG https://github.com/TED-H-com/multi-ai-chat-desktop.git work/multi-ai-chat
          git clone --depth 1 https://github.com/jinpenglu74/VeloVoice.git work/VeloVoice

      - name: Apply RewriteDubbing V2 patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python ci-bundle/ai-core-patch/apply_v2_core_patch.py work/multi-ai-chat
          python ci-bundle/ai-core-patch/apply_v2_regression_patch.py work/multi-ai-chat
          python ci-bundle/patch_velovoice.py work/VeloVoice ci-bundle

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: work/VeloVoice/pom.xml

      - name: Build clean VeloVoice V2 sidecar
        shell: pwsh
        working-directory: work/VeloVoice
        run: |
          $ErrorActionPreference = 'Stop'
          mvn -B -DskipTests package assembly:single
          $jar = Get-ChildItem target -File -Filter '*-release.jar' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $jar) { $jar = Get-ChildItem target -File -Filter '*.jar' | Sort-Object Length -Descending | Select-Object -First 1 }
          if (-not $jar) { throw 'VeloVoice fat JAR not produced' }
          & "$env:JAVA_HOME\bin\java.exe" -cp $jar.FullName mai_onsyn.RewriteDubbingV2.velo.VeloVoiceProtocolSelfTest
          New-Item -ItemType Directory -Force ..\multi-ai-chat\v2-resources\Tools\VeloVoiceBridge | Out-Null
          New-Item -ItemType Directory -Force ..\multi-ai-chat\v2-resources\Dependencies | Out-Null
          New-Item -ItemType Directory -Force ..\multi-ai-chat\v2-resources\Licenses | Out-Null
          Copy-Item $jar.FullName ..\multi-ai-chat\v2-resources\Tools\VeloVoiceBridge\RewriteDubbing-V2-VeloVoice-Sidecar.jar -Force
          Copy-Item lib\jacob-1.21\jacob-1.21-x64.dll ..\multi-ai-chat\v2-resources\Dependencies\ -Force
          Copy-Item LICENSE ..\multi-ai-chat\v2-resources\Licenses\VeloVoice-LICENSE.txt -Force
          Copy-Item NOTICE ..\multi-ai-chat\v2-resources\Licenses\VeloVoice-NOTICE.txt -Force
          New-Item -ItemType Directory -Force ..\..\ci-bundle\v2-sidecar | Out-Null
          Copy-Item $jar.FullName ..\..\ci-bundle\v2-sidecar\RewriteDubbing-V2-VeloVoice-Sidecar.jar -Force

      - name: Run post-build sidecar isolation contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python ci-bundle/ai-core-patch/tests/run_v2_contract_tests.py

      - name: Build dedicated Java runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'work/multi-ai-chat/v2-resources/Runtime'
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          $modules = 'java.base,java.datatransfer,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.sql,java.xml,jdk.charsets,jdk.crypto.ec,jdk.unsupported'
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules $modules --strip-debug --no-man-pages --no-header-files --output $runtime
          if (-not (Test-Path "$runtime/bin/java.exe")) { throw 'Bundled Java runtime missing java.exe' }
          Copy-Item work/multi-ai-chat/LICENSE work/multi-ai-chat/v2-resources/Licenses/Multi-AI-Chat-LICENSE.txt -Force

      - name: Smoke-test VeloVoice local bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, queue, socket, subprocess, tempfile, threading
          from pathlib import Path
          root = Path("work/multi-ai-chat/v2-resources").resolve()
          java = root / "Runtime/bin/java.exe"
          jar = root / "Tools/VeloVoiceBridge/RewriteDubbing-V2-VeloVoice-Sidecar.jar"
          deps = root / "Dependencies"
          work = Path(tempfile.mkdtemp(prefix="rewrite-v2-velo-smoke-"))
          token = "acceptance-" + ("7" * 48)
          env = os.environ.copy()
          env["REWRITE_VELOVOICE_TOKEN"] = token
          env["REWRITE_VELOVOICE_PORT"] = "0"
          proc = subprocess.Popen(
              [str(java), f"-Djava.library.path={deps}", "-cp", str(jar),
               "mai_onsyn.RewriteDubbingV2.velo.VeloVoiceSidecarLauncher"],
              cwd=work, env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, encoding="utf-8", errors="replace")
          q = queue.Queue()
          def pump_stdout():
              for raw in proc.stdout:
                  q.put(raw)
          threading.Thread(target=pump_stdout, daemon=True).start()
          try:
              deadline = __import__("time").time() + 40
              ready = None
              seen = []
              while __import__("time").time() < deadline:
                  if proc.poll() is not None and q.empty():
                      break
                  try:
                      raw = q.get(timeout=1)
                  except queue.Empty:
                      continue
                  line = raw.strip()
                  seen.append(line)
                  if line.startswith("VELOVOICE_BRIDGE_READY "):
                      ready = line
                      break
              if ready is None:
                  proc.terminate()
                  try: proc.wait(timeout=5)
                  except subprocess.TimeoutExpired: proc.kill()
                  err = proc.stderr.read()
                  raise SystemExit(f"sidecar did not become ready; stdout={seen[-20:]!r}; stderr={err[-8000:]!r}")
              port = int(ready.split()[-1])
              with socket.create_connection(("127.0.0.1", port), timeout=5) as s:
                  s.sendall((json.dumps({"token": token, "action": "ping"}) + "\n").encode())
                  reply = b""
                  while not reply.endswith(b"\n"):
                      reply += s.recv(4096)
              data = json.loads(reply)
              if data.get("ok") is not True or data.get("service") != "VeloVoice":
                  raise SystemExit(f"invalid VeloVoice ping: {data}")
              print("VELOVOICE_LIVE_BRIDGE_SMOKE_PASS", port)
          finally:
              proc.terminate()
              try: proc.wait(timeout=8)
              except subprocess.TimeoutExpired: proc.kill()
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Multi-AI dependencies
        shell: pwsh
        working-directory: work/multi-ai-chat
        run: pnpm install --frozen-lockfile

      - name: Official upstream verify plus V2 tests
        shell: pwsh
        working-directory: work/multi-ai-chat
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm verify
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows NSIS installer
        shell: pwsh
        working-directory: work/multi-ai-chat
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build --bundles nsis

      - name: Silent-install and validate payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'work/multi-ai-chat/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup not found' }
          $install = Join-Path $env:RUNNER_TEMP 'RewriteDubbingV2Install'
          if (Test-Path $install) { Remove-Item $install -Recurse -Force }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$install" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "NSIS silent install failed: $($p.ExitCode)" }
          $mainExe = Get-ChildItem $install -Recurse -Filter '*.exe' -File |
            Where-Object { $_.Name -notmatch 'uninstall|unins|javaw?|webview' } |
            Sort-Object Length -Descending | Select-Object -First 1
          $java = Get-ChildItem $install -Recurse -Filter 'java.exe' -File | Select-Object -First 1
          $sidecar = Get-ChildItem $install -Recurse -Filter 'RewriteDubbing-V2-VeloVoice-Sidecar.jar' -File | Select-Object -First 1
          $jacob = Get-ChildItem $install -Recurse -Filter 'jacob-1.21-x64.dll' -File | Select-Object -First 1
          if (-not $mainExe) { throw 'Installed main executable missing' }
          if (-not $java) { throw 'Installed Java runtime missing' }
          if (-not $sidecar) { throw 'Installed VeloVoice sidecar missing' }
          if (-not $jacob) { throw 'Installed JACOB dependency missing' }
          & $java.FullName -cp $sidecar.FullName mai_onsyn.RewriteDubbingV2.velo.VeloVoiceProtocolSelfTest
          $app = Start-Process -FilePath $mainExe.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "Installed app exited during launch smoke with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $setup.FullName artifacts/RewriteDubbing_V2.0.0_Windows_x64_Setup.exe -Force
          Write-Host "INSTALLED_APP_LAUNCH_SMOKE_PASS $($mainExe.FullName)"

      - name: Prepare complete source package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'source-package'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Force "$out/Multi-AI-Chat-V2" | Out-Null
          robocopy 'work/multi-ai-chat' "$out/Multi-AI-Chat-V2" /E /XD '.git' 'node_modules' 'target' 'dist' 'Runtime' /XF 'RewriteDubbing-V2-VeloVoice-Sidecar.jar' | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy app source failed: $LASTEXITCODE" }
          robocopy 'work/VeloVoice' "$out/VeloVoice-Patched-Source" /E /XD '.git' 'target' | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy VeloVoice source failed: $LASTEXITCODE" }
          robocopy 'ci-bundle' "$out/Build-Patch-And-Tests" /E /XD '__pycache__' 'v2-sidecar' | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy patch source failed: $LASTEXITCODE" }
          @"
          RewriteDubbing V2.0.0
          AI core: Multi-AI Chat Desktop v1.9.6
          Fixed workflow: DeepSeek -> ChatGPT -> DeepSeek -> VeloVoice
          Rewrite workflow uses the currently selected embedded provider conversations and never creates a new provider session.
          VeloVoice keeps user engine/language/voice/speed/volume/pitch/thread/output settings unchanged.
          "@ | Set-Content "$out/BUILD-V2.txt" -Encoding UTF8
          Compress-Archive -Path "$out/*" -DestinationPath artifacts/RewriteDubbing_V2.0.0_Source.zip -CompressionLevel Optimal -Force

      - name: Create acceptance report and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'artifacts/RewriteDubbing_V2.0.0_Windows_x64_Setup.exe',
            'artifacts/RewriteDubbing_V2.0.0_Source.zip'
          )
          $lines = @(
            'RewriteDubbing V2.0.0 Windows Acceptance',
            'AI core baseline: Multi-AI Chat Desktop v1.9.6',
            'Workflow: DeepSeek -> ChatGPT -> DeepSeek -> VeloVoice',
            'Conversation rule: current selected embedded chats; no automatic new session',
            'Raw-text relay: exact string handoff',
            'Checks: V2 contracts, pipeline behavior, clean VeloVoice compile/protocol, live sidecar ping, pnpm verify, Rust tests, NSIS build, silent install payload, installed app launch smoke',
            ''
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing acceptance artifact: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content artifacts/RewriteDubbing_V2.0.0_ACCEPTANCE.txt -Encoding UTF8
          Get-Content artifacts/RewriteDubbing_V2.0.0_ACCEPTANCE.txt

      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RewriteDubbing-V2.0.0-Windows-Acceptance
          path: |
            artifacts/RewriteDubbing_V2.0.0_Windows_x64_Setup.exe
            artifacts/RewriteDubbing_V2.0.0_Source.zip
            artifacts/RewriteDubbing_V2.0.0_ACCEPTANCE.txt
          if-no-files-found: error
          retention-days: 30
