name: RewriteDubbing V2 Baseline

on:
  push:
    branches:
      - rewrite-dubbing-v2-source
    paths:
      - '.github/workflows/rewrite_dubbing_v2_baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: rewrite-dubbing-v2-source
          fetch-depth: 0

      - name: Import frozen Multi-AI Chat v1.9.6 into our source branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item .github/workflows/rewrite_dubbing_v2_baseline.yml "$env:RUNNER_TEMP\baseline.yml"
          git clone --depth 1 --branch v1.9.6 https://github.com/TED-H-com/multi-ai-chat-desktop.git "$env:RUNNER_TEMP\upstream"
          git rm -r -f . --ignore-unmatch
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:RUNNER_TEMP\upstream" -Force | Where-Object { $_.Name -ne '.git' } | Copy-Item -Destination . -Recurse -Force
          New-Item -ItemType Directory -Force .github/workflows | Out-Null
          Copy-Item "$env:RUNNER_TEMP\baseline.yml" .github/workflows/rewrite_dubbing_v2_baseline.yml -Force
          git config user.name "RewriteDubbing Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Import Multi-AI Chat v1.9.6 as RewriteDubbing V2 baseline [skip ci]"
            git push origin HEAD:rewrite-dubbing-v2-source
          }

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.0'
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify original baseline
        run: pnpm verify

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Prepare baseline deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deliverables | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          Copy-Item $exe.FullName deliverables/MultiAI_v1.9.6_Baseline_Setup.exe
          git archive --format=zip --output=deliverables/RewriteDubbing_V2_Baseline_Source.zip HEAD
          Get-FileHash deliverables/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content deliverables/SHA256.txt -Encoding ascii

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RewriteDubbing-V2-Baseline
          path: deliverables/*
          if-no-files-found: error
          retention-days: 7
